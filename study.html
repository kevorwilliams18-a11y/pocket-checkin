.hero{background:linear-gradient(120deg,#fbd9eb,#e6d5ff);border:1px solid #f4cee9}

.brand{color:#704292}.primary{background:#70439a;border-color:#70439a}.primary:hover{background:#5a337e}

<main><header><span class="brand"><span aria-hidden="true">✿</span> Pocket Check-in</span><nav aria-label="Main"><a href="./">Check-in</a><a href="./study.html" aria-current="page">Study planner</a></nav></header>
<section class="hero"><div><div class="petal-trim" aria-hidden="true">✿ ❀ ✿</div><h1>Study planner</h1><p>Keep assignments, study sessions, and meetings in one place.</p></div></section>
<div class="grid planner-grid"><article><h2 id="formHeading">Add to your planner</h2>
<form id="entryForm"><label for="kind">Type</label><select id="kind"><option>Assignment</option><option>Study session</option><option>Meeting</option><option>Exam</option></select>
<label for="title">Title</label><input id="title" required maxlength="100">
<label for="when">Due date or start time</label><input id="when" type="datetime-local" required>
<label for="details">Subject or notes (optional)</label><textarea id="details" maxlength="500"></textarea>
<label for="meetingLink">Meeting or resource link (optional)</label><input id="meetingLink" type="url" maxlength="1000" placeholder="https://">
<div class="choices"><button class="primary" id="save">Add to planner</button><button type="button" id="cancel" hidden>Cancel edit</button></div></form>
<p class="small" id="plannerStatus" role="status">Your planner is saved on this device.</p></article>
<article><h2>Your schedule</h2><label for="filter">Show</label><select id="filter"><option value="upcoming">Open items</option><option value="all">Everything</option><option value="done">Completed</option></select><div id="entries"></div></article></div></main>
<script>
const byId = id => document.getElementById(id);
const storageKey = 'pocket-study-planner-v1';
const form = byId('entryForm');
let entries = [];
let editingId = null;
try { entries = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch {}
function update(next, message) {
  try {
    localStorage.setItem(storageKey, JSON.stringify(next));
  } catch {
    byId('plannerStatus').textContent = 'This browser could not save the change.';
    return false;
  }
  entries = next;
  render();
  byId('plannerStatus').textContent = message;
  return true;
}
function resetForm() {
  editingId = null;
  form.reset();
  byId('formHeading').textContent = 'Add to your planner';
  byId('save').textContent = 'Add to planner';
  byId('cancel').hidden = true;
}
function action(label, handler) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.onclick = handler;
  return button;
}
function render() {
  const list = byId('entries');
  const filter = byId('filter').value;
  const visible = entries.filter(item => filter === 'all' || item.done === (filter === 'done'))
    .sort((first, second) => first.when.localeCompare(second.when));
  list.replaceChildren();
  if (!visible.length) list.textContent = filter === 'done' ? 'No completed items yet.' : 'Nothing on this list yet.';
  for (const item of visible) {
    const card = document.createElement('section');
    card.className = 'planner-item';
    const title = document.createElement('h3');
    title.textContent = item.title;
    const date = document.createElement('p');
    const when = new Date(item.when);
    date.textContent = item.kind + ' · ' + when.toLocaleString([], {dateStyle:'medium',timeStyle:'short'})
      + (item.done ? ' · Done' : when < new Date() && item.kind === 'Assignment' ? ' · Overdue' : '');
    card.append(title, date);
    if (item.details) {
      const notes = document.createElement('p');
      notes.textContent = item.details;
      card.append(notes);
    }
    if (/^https?:\/\//i.test(item.meetingLink)) {
      const link = document.createElement('a');
      link.href = item.meetingLink;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = item.kind === 'Meeting' ? 'Open meeting link' : 'Open resource';
      card.append(link);
    }
    const controls = document.createElement('div');
    controls.className = 'choices';
    controls.append(
      action(item.done ? 'Reopen' : 'Mark done', () => update(entries.map(entry => entry.id === item.id ? {...entry, done:!entry.done} : entry), item.done ? 'Item reopened.' : 'Item completed.')),
      action('Edit', () => {
        editingId = item.id;
        for (const field of ['kind','title','when','details','meetingLink']) byId(field).value = item[field];
        byId('formHeading').textContent = 'Edit planner item';
        byId('save').textContent = 'Save changes';
        byId('cancel').hidden = false;
        byId('title').focus();
      }),
      action('Remove', () => {
        if (!confirm('Remove “' + item.title + '” from your planner?')) return;
        if (update(entries.filter(entry => entry.id !== item.id), 'Item removed.') && editingId === item.id) resetForm();
      })
    );
    card.append(controls);
    list.append(card);
  }
}
form.onsubmit = event => {
  event.preventDefault();
  const item = Object.fromEntries(['kind','title','when','details','meetingLink'].map(field => [field, byId(field).value.trim()]));
  if (!item.title) { byId('plannerStatus').textContent = 'Give this item a title.'; return; }
  if (item.meetingLink && !/^https?:\/\//i.test(item.meetingLink)) { byId('plannerStatus').textContent = 'Enter a web link beginning with https:// or http://.'; return; }
  const previous = entries.find(entry => entry.id === editingId);
  const next = previous
    ? entries.map(entry => entry.id === editingId ? {...entry,...item} : entry)
    : [...entries,{...item,id:crypto.randomUUID(),done:false}];
  if (update(next, previous ? 'Changes saved.' : 'Added to the planner.')) resetForm();
};
byId('cancel').onclick = resetForm;
byId('filter').onchange = render;
render();
</script></html>
